name: "nau7802_dual_loadcell"
description: "Dual load-cell bridge front-end: NAU7802 24-bit ADC, ratiometric AVDD excitation, per-channel anti-alias filter (1k series + 100nF diff + 10nF CM to AVDD and GND), I2C + DRDY interface"
provenance:
  validated_on: "DualScale_Compact (combined board)"
  bench_date: null
  field_report: null
  extracted_from: "DualScale_Compact.kicad_sch"
  source_sha256: "5cbc84b2749bf05a3c0c4095503a58be815f84774770b6a52e2274defbbac080"
refs: [C2, C3, C9, C10, C11, C12, C13, C14, C15, C16, C17, C18, C19, C20, C21, C22, J4, J5, R2, R3, R4, R5, R6, R7, U2]
ports:
  - { name: "DRDY", dir: output, class: "digital", note: "conversion-ready interrupt (active high); optional — status can be polled over I2C" }  # from net GP6
  - { name: "SCL", dir: input, class: "digital", note: "I2C clock (NAU7802 SCLK); pull-up R3 4.7k to 3V3 lives INSIDE this block" }  # from net GP4
  - { name: "SDA", dir: bidirectional, class: "digital", note: "I2C data (NAU7802 SDIO, fixed addr 0x2A); pull-up R2 4.7k to 3V3 lives INSIDE this block" }  # from net GP3
rails:
  - { name: "3V3", budget_ma: 10 }  # DVDD ~2mA + internal-LDO AVDD sourcing 2x ~1k bridges ~7mA (verified: nau7802_addon/DualScale_NAU7802_04c_analysis.md)
  - { name: "GND", budget_ma: 10 }  # return for the above
constraints:
  - "I2C address 0x2A is fixed in silicon — one NAU7802 block per bus"
  - "I2C pull-ups (R2/R3 4.7k) are included — do not add a second set on the same bus"
  - "AVDD (bridge excitation + REFP) is generated by U2's internal LDO — ratiometric by construction; never drive AVDD from an external rail"
  - "Per-channel anti-alias filter as validated: 1k series + 100nF differential (Cdiff = 10x Ccm) + 10nF common-mode to BOTH AVDD (excitation-referenced, deliberate) and GND"
  - "XIN/XOUT (pins 10/11) are NC — internal RC oscillator; do not wire a crystal without revalidating"
  - "Load cells plug into J4/J5 (JST-PH 4-pin, footprint ships in CircuitBlocks): 1=EXC+(AVDD) 2=SIG+ 3=SIG- 4=EXC-(GND)"
