# =====================================================================
# KiCad Footprint Map — Verified against KiCad 7/8 official libraries
# =====================================================================
# Source: github.com/KiCad/kicad-footprints (archived)
#         gitlab.com/kicad/libraries/kicad-footprints (current)
#
# Format: "LibraryName:FootprintName"
# Each entry uses the exact string KiCad expects in the footprint field.
# Where multiple variants exist (HandSolder, ThermalVias, etc.),
# the standard reflow variant is listed as "default".
# =====================================================================


