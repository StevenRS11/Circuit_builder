  "LFPAK56":       "Package_TO_SOT_SMD:LFPAK56"         # NXP LFPAK56 (SO-8 compatible)
  "PowerPAK-SO-8": "Package_TO_SOT_SMD:PowerPAK_SO-8_Single"


