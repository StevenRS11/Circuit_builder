# 3b. TRANSISTOR PACKAGES
# ═════════════════════════════════════════════════════════════════════
# SOT-23 is the most common for small-signal MOSFETs and BJTs.
# For power MOSFETs, see to_smd (DPAK/D2PAK) and to_tht (TO-220).

transistors:
  # Small-signal SOT packages (Package_TO_SOT_SMD)
  "SOT-23":        "Package_TO_SOT_SMD:SOT-23"
  "SOT-23-GSD":    "Package_TO_SOT_SMD:SOT-23"          # NMOS/PMOS: G=1, S=2, D=3
  "SOT-23-BCE":    "Package_TO_SOT_SMD:SOT-23"          # BJT: B=1, C=2, E=3
  "SOT-323":       "Package_TO_SOT_SMD:SOT-323_SC-70"
  "SC-70":         "Package_TO_SOT_SMD:SOT-323_SC-70"
  "SOT-223":       "Package_TO_SOT_SMD:SOT-223-3_TabPin2"
  "SOT-89":        "Package_TO_SOT_SMD:SOT-89-3"
  # Power SMD packages (see also to_smd section for DPAK/D2PAK)
