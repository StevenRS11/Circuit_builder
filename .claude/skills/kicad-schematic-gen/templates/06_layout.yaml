# Stage 6 — Layout document (TEMPLATE / schema reference)
#
# This is the ONLY per-project input that carries geometry. Combined with the
# Stage 5b netlist YAML (connectivity) and the Stage 3 BOM (value + footprint),
# the engine `generate_from_data.py` produces the .kicad_sch:
#
#   python generate_from_data.py <netlist.yaml> <bom_flat.md> <layout.yaml> \
#       -o <project>.kicad_sch
#
# Single-source rule: do NOT put values or footprints here — they live in the
# BOM and are joined on reference designator. Do NOT put connectivity here — it
# lives in the netlist. This file owns only WHERE things are drawn and how an IC's
# pins are arranged around its symbol body.
#
# The engine self-verifies before saving (structural validator + netlist verifier
# + BOM cross-check) and refuses to emit a file with errors. A missing junction
# (an unintended wire collision, e.g. a balance tap shorting to GND) is treated as
# a blocking error — fix the placement (often a rotation) and regenerate.

project: "my_board"
title: "My Board - one-line description"
rev: "1.0"

# Nets wired via power symbols (e.g. rails). GND is ALWAYS a power symbol and is
# handled implicitly — do not list it here. Every other net not listed becomes a
# net label.
power_nets: ["+3V3", "+5V", "VBUS"]

# ── Placements: one line per component. lib_id + coordinates ONLY. ───────────
# x/y are millimetres (snapped to the 1.27mm grid); origin top-left, +y is down.
# rotation is 0 | 90 | 180 | 270. Components may be auto-nudged to avoid overlap.
#
# Passives and generic connectors are auto-registered from their lib_id and need
# no entry in `symbols:` below:
#   Device:R  Device:C  Device:C_Polarized  Device:L  Device:LED  Device:D
#   Device:Q_NMOS_GSD  Device:Q_PMOS_GSD  Device:Q_NPN_BCE  Device:Q_PNP_BCE
#   Device:Crystal  Device:Crystal_GND24
#   Connector_Generic:Conn_01x0N   (N pins, generic numbered)
# Any other lib_id (a real IC, or a connector/part with named pins) MUST have a
# matching entry in `symbols:`.
placements:
  U1: { lib_id: "Regulator_Linear:AP2112K-3.3", x: 100, y: 100 }
  C1: { lib_id: "Device:C", x: 80, y: 100 }
  C2: { lib_id: "Device:C", x: 120, y: 100 }
  J1: { lib_id: "Connector_Generic:Conn_01x02", x: 60, y: 100 }
  # J2: { lib_id: "Connector_Generic:Conn_01x04", x: 200, y: 100, rotation: 270 }
  #   ^ Rotating a multi-pin connector so pins face DOWN gives each pin its own
  #     drop column — use this when a GND tie would otherwise cross a sibling stub.

# ── Symbols: IC / custom symbol definitions. ────────────────────────────────
# Only ICs and named-pin parts go here. There are TWO ways to define one:
#
# (A) from_library — the symbol ALREADY EXISTS in a registered library (a KiCad
#     built-in, or a user/imported lib like `Custom:`). USE IT AS-IS: the engine
#     embeds the real symbol (its drawing + real pin geometry), exactly like KiCad
#     placing the part. Author NO pins and NO side/index. This is the normal path
#     for any part that resolves via `check_kicad_library.py --lookup`.
#         "Custom:NAU7802":
#           from_library: true
#     Pass `--project-dir <dir>` (and `--sym-lib NICK=PATH` for an arbitrary lib)
#     to generate_from_data.py so the engine can locate it. For a fully
#     self-contained build, inline the raw symbol with `block: |` instead.
#
# (B) hand-authored pins — ONLY for a part that exists in NO library. Give each
#     pin as [number, name, type, side, index] (below). side/index is YOUR layout
#     judgment and applies only in this case. (Prefer installing a vendor symbol
#     with the kicad-import-lib skill, which turns it into case A.)
#
# Each hand-authored pin is [number, name, type, side, index]:
#   number : pin number/name as it appears in the netlist `pins:` array (must match exactly)
#   name   : pin label shown on the symbol (from the datasheet / KiCad library)
#   type   : power_in | power_out | input | output | bidirectional | passive |
#            open_collector | tri_state | unspecified | no_connect
#   side   : left | right | top | bottom
#   index  : 0-based position along that side, top-to-bottom or left-to-right
#
# The engine cross-checks each IC's symbol pin-number set against the netlist's
# `components[ref].pins` set and errors on any mismatch — this catches pin typos
# before generation.
symbols:
  # (A) embed a real library symbol verbatim — no pins, no side/index:
  "Custom:NAU7802":
    from_library: true
  # (B) hand-authored symbol for a part in no library:
  "Regulator_Linear:AP2112K-3.3":
    ref_prefix: U
    width: 12.7
    pins:
      - ["1", "VIN", "power_in",  "left",   0]
      - ["3", "EN",  "input",     "left",   1]
      - ["2", "GND", "power_in",  "bottom", 0]
      - ["5", "VOUT","power_out", "right",  0]
      - ["4", "NC",  "no_connect","right",  1]

# ── Blocks: compose proven subcircuits from the blocks/ registry (W1b). ──────
# Each instance clones the block's validated child sheet next to the output
# (refs re-annotated into a per-instance range: U2 -> U102, second instance
# U202, ... — override with refdes_base) and places a hierarchical sheet
# symbol wired through its ports. Block components do NOT appear in this
# file's placements, the netlist, or the BOM — the bundle owns them; the
# engine emits {out}_bom_flat.md with the merged whole-board BOM for Stage 9.
#
# Rules the engine gates: port_map must cover the block's contract ports
# EXACTLY (see blocks/{name}/block.yaml); every mapped net must be declared in
# the netlist YAML or be a power net; every rail the block requires must be in
# power_nets above (GND implicit). READ block.yaml `constraints:` first — they
# are judgment the engine does not script (e.g. NAU7802's I2C address is fixed
# in silicon: two instances need two buses).
#
# blocks:
#   scale1:
#     block: nau7802_dual_loadcell    # directory under the blocks/ registry
#     x: 180
#     y: 80
#     port_map:                        # port (from block.yaml) -> board net
#       SDA: I2C_SDA
#       SCL: I2C_SCL
#       DRDY: SCALE1_DRDY
#     # refdes_base: 300               # optional explicit range base
#
# blocks_dir: "path/to/blocks"         # optional registry override (--blocks-dir)
