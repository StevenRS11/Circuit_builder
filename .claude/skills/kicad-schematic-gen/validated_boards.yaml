    lessons: []
    field_reports: []

  - board: pushbuttonDef
    rev: "1"
    status: validated
    bench_date: null      # in service; user confirms "worked as built", date unrecorded
    outputs_dir: "PaddleDNA-Circuits/projects/pushbuttonDef (external repo)"
    summary: >-
      ESP32-S3-ZERO deflection tester (pushbutton rev). Fabbed, worked as
      built, currently IN SERVICE running the deflection machine until
      pushbuttonDef_combined arrives. No bench failures reported.
      Schematic-only project dir (no .kicad_pcb alongside).
    lessons: []
    field_reports: []

  - board: pushbuttonDef_combined
    rev: "combined"
    status: in_bringup
    bench_date: null      # boards in transit from fab (confirmed 2026-07-07)
    outputs_dir: "PaddleDNA-Circuits/projects/pushbuttonDef_combined (external repo)"
    summary: >-
      Combined successor board: will run BOTH the CoF and deflection machines
