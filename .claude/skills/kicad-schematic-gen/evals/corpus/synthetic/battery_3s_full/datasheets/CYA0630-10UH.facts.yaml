notes: >
  BQ24650 synchronous-buck charger inductor. Sized for Vin=15V, Vout=12.2V,
  Iout=1.5A, fsw=600kHz (BQ24650 default). L = Vout*(Vin-Vout)/(Vin*dIL*fsw)
  with dIL=30%*1.5A=0.45A -> L = 12.2*2.8/(15*0.45*600e3) = ~8.4uH -> pick 10uH.
  Isat 5.5A >> Ipk (~1.7A) -> large margin. DCR 71mOhm -> ~0.16W at 1.5A, fine.
  Footprint: KiCad has no exact SHOU HAN land; use a generic 7.3x6.6 inductor
  pad or author a custom land from the LCSC drawing at layout time.
