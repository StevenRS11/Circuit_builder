notes: >
  Item 5b - balance-tap ESD on the JST-XH 3S balance connector, AND a candidate
  for VBUS over-voltage clamp (item 5a). Cell-tap voltages referenced to B- are
  ~4.2V (B1), ~8.4V (B2), ~12.6V (B+), so a single standoff cannot cover all
  taps - size the SMF per tap so Vrwm sits just above the tap's max voltage:
    B1 tap  -> SMF5.0CA  (5.0V standoff)
    B2 tap  -> SMF12CA   (12V standoff)  [LCSC SMF12CA, same family/footprint]
    B+ tap  -> SMF15CA   (15V standoff)  [LCSC SMF15CA, same family/footprint]
  All share SOD-123FL footprint and Device:D_TVS symbol. SMF series is the cheap,
  ubiquitous bidirectional choice. For VBUS (15V from USB-C PD), a unidirectional
  SMF15A (15V standoff, ~24V clamp) on VBUS-to-GND is appropriate; keep it
  separate from the USBLC6 (which only clamps data+VBUS to ~9V and is data-line
  oriented). Card the per-tap SMFxxCA values into the BOM at Stage 3.
