# Fact card — intrinsic part facts only (no per-design connectivity)
mpn: OS102011MS2QN1
manufacturer: C&K (Littelfuse)
description: "SPDT ON-ON miniature slide switch, 100mA/12VDC, THT vertical, non-shorting"
role: "Master power switch (R11 [CRITICAL]) — gates the enable/CE lines, NOT the power path"

# WHY THIS PART / TOPOLOGY (R11 budget):
# The switch is wired into the LOW-CURRENT enable/control lines (charger CE/EN and the two
# output load-switch P-FET gates), so its 100mA contact rating is never a limit. With the
# switch in OFF, every downstream control IC is held in shutdown and both output P-FETs are
# held OFF (gate pulled to source). A mechanical open contact has ZERO leakage, so the only
# storage drain is the OFF-state leakage of the parts left connected to the battery:
#   - output load-switch P-FET drain leakage IDSS:  ~1 uA each (AO4407A/AO3401A, 25C)  x2 outputs = ~2 uA
#   - charger IC shutdown/Iq (CE high -> shutdown): typ single-digit uA (part-specific; see charger card)
#   - gate-pulldown resistor on a switched-off node: ~0 (no path to GND when switch open)
# TOTAL well under the ~100 uA gate even with worst-case TJ=55C IDSS (~5 uA each).
# This is the simplest provably-<100uA topology: zero-leakage mechanical contact in the control plane.
# Note THT 3-pin part -> PCBway charges per-pin assembly (3 pins); acceptable for one switch.

