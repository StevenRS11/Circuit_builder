mpn: "BQ25756RRVR"
role: "1-14 cell wide-Vin buck-boost battery charge CONTROLLER (no system power path) — DISQUALIFIED on R2"
package: "QFN-36-EP (5x6 mm, RRV)"
datasheet: "BQ25756.pdf"
notes: >
  FAILS R2 (HARD GATE — DISQUALIFIED). Title (pg1): "Standalone/I2C Controlled, 1- to
  14-Cell Bidirectional Buck-Boost Battery Charge Controller." Despite a "Power-Path
  Manager" register/block, this is NOT an NVDC system power path: pg12 "POWER-PATH
  MANAGER" defines only discharge loads (IAC_LOAD 16mA on VAC, IBAT_LOAD 16mA on SRN) —
  not a regulated SYS rail. Pin list (pg4-5) has NO SYS/VSYS pin: power nodes are VAC
  (input), SW1/SW2 (inductor), and the battery via SRN/SRP/FB. The converter output is
  the battery; with the battery absent there is no rail held up from VAC for the system.
  => Disqualified per R2 for the same reason as BQ24650. (The "VAC converter enable...
  no battery" spec describes converter start, not a system output.)
  Positives that do not override R2: R3/R4 standalone resistor-set & MCU-FREE — charge
  current via RICHG on ICHG pin, charge voltage via FB/FBG divider, input current via
  RILIM on ILIM_HIZ; covers 3S easily (1-14 cell). R5: HAS a TS pin (103AT NTC). R10:
  STAT1/STAT2 + PG status outputs. No KiCad built-in symbol.
