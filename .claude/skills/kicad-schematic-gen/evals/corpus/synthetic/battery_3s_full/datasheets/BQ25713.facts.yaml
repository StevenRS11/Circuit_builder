mpn: "BQ25713RSNR"
role: "1s-4s NVDC buck-boost battery charge controller with integrated system power path (VSYS) — RECOMMENDED for 3S"
package: "QFN-32-EP (4x4 mm, WQFN RSN), 0.4mm pitch"
datasheet: "BQ25713.pdf"
notes: >
  PASSES R2 (HARD GATE): NVDC power-path. Datasheet pg1 features list
  "Narrow voltage DC (NVDC) power path management" + "Instant-on with no battery
  or depleted battery"; pg4: "The system keeps operating even when the battery is
  completely discharged or removed." VSYS (pin 22) is held up from VBUS via the
  buck-boost converter; BATDRV (pin 21) regulates VSYS at minimum system voltage
  when battery is depleted and acts as ideal-diode in supplement mode.
  R3/R4: charge voltage AND current set via I2C registers (REG0x05/04 charge
  voltage, ICHG register) — NOT resistor-set, NOT MCU-free. Requires an I2C host.
  Cell count (1-4s) is hardware-selectable on CELL_BATPRESZ pin (3-cell = 12V class).
  R5 (TS/NTC pin): NO dedicated TS thermistor pin on this device — NTC temperature
  qualification must be done off-chip (external comparator or host/BMS).
  R10: CHRG_OK (PG-equivalent, pin 4) + STAT via I2C status registers (no discrete
  CHG LED pin; PSYS/IADPT/IBAT are monitor outputs).
  External NFETs (Q1-Q4) required (it is a controller, not integrated-FET).
  No KiCad built-in symbol — custom symbol required.
