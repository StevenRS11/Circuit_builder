mpn: "BQ25703ARSNR"
role: "1s-4s NVDC buck-boost battery charge controller with integrated system power path (VSYS)"
package: "VQFN-32-EP (4x4 mm, WQFN RSN), 0.4mm pitch"
datasheet: "BQ25703A.pdf"
notes: >
  PASSES R2 (HARD GATE): NVDC power path. Datasheet pg1 features "NVDC power path
  management" + "Instant-on with no battery or depleted battery"; functional block
  shows VSYS held from VBUS through buck-boost (Q1-Q4) with BATDRV controlling the
  battery FET. System rail stays alive battery-absent. Functionally the same part
  family as BQ25713 (BQ25713 is "pin-to-pin and software compatible to BQ25703A").
  R3/R4: charge V and I set via I2C registers only — not resistor-set, not MCU-free.
  Cell count 1-4s selectable on CELL_BATPRESZ pin. R5: NO TS/NTC pin (off-chip NTC
  needed). R10: CHRG_OK pin + I2C status. External NFETs required. No KiCad symbol.
  Slightly pricier / higher stock than BQ25713; BQ25713 is the newer pin-compatible
  preferred choice. Pin 5 is EN_OTG here (vs OTG/VAP on BQ25713).
