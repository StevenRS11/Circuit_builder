specs:
  vin_min_v: 5            # 1V possible with a separate 5-75V VS bias
  vin_max_v: 75           # operating; 100V transient survival -> huge margin over 15V VBUS
  abs_max_v: 100
  external_fets: "1 N-FET per input -> 2 total for a 2-input OR"
  current_capability: "set by external N-FET (e.g. AO-class N-FET) — easily 3A"
  forward_drop: "ideal-diode regulated; Vsd target tens of mV (Rds*I), << Schottky"
  reverse_response_typ_ns: 25
  gate_drive: "internal charge pump, ~12V Vgs clamp above IN"
  package: "TSOT-23-6 (6-Pin SOT)"
  priority_mechanism: >
    Natural higher-rail-wins ideal-diode OR. With VBUS(15V) > VBAT(<=12.6V), the VBUS
    LM5050-1 keeps its FET enhanced and the VBAT branch sees IN<OUT so its reverse
    comparator holds that FET off (battery isolated). When VBUS drops below VBAT, the VBAT
    branch's body diode conducts then enhances -> seamless handoff. VBUS priority is
    inherent to the voltage ordering; STAT/OFF could add explicit priority but not required.

datasheet:
  file: LM5050-1.pdf
  source_url: "https://www.ti.com/lit/ds/symlink/lm5050-1.pdf"
  rev: "TI SNVS629F / Dec 2019"
  r2_citation: >
    Sec 8.2.3 'ORing of Two Power Sources' + Figure 28 (pg 18): two LM5050-1 channels OR two
    sources into a common output. Sec 8.1.2 / Figure 21-22 (pg 14) 'OR-ing With MOSFETs':
    high-side OR-ing controller drives an N-FET to replace an OR-ing diode; the higher source
    holds the common output and the reverse comparator (pg 13/16) blocks back-current from the
    lower source within ~25ns. This holds SYS from VBUS regardless of battery state -> meets R2.

