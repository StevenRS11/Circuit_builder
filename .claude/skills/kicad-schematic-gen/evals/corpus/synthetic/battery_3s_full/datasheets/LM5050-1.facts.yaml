# Fact card — intrinsic part facts only (no per-design connectivity)
mpn: "LM5050MK-1/NOPB"
manufacturer: Texas Instruments
description: "High-side OR-ing ideal-diode controller, 5V-75V (1V w/ separate VS bias), drives external N-channel MOSFET, charge-pump gate driver, ~25ns reverse comparator"
role: >
  Power-path ORing MUX controller (R2 enabler, Path B). Two LM5050-1 + two N-FETs OR
  VBUS and VBAT into a common SYS node; each ideal diode conducts only when its input is
  the higher rail, so SYS is always held from the higher source and the lower source's FET
  is reverse-blocked (no backfeed). RECOMMENDED for the 3A SYS MUX.

