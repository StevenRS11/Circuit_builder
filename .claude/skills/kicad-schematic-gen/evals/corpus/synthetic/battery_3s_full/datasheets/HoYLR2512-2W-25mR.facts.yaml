notes: >
  BQ24650 charge-current sense resistor (SRP/SRN). Full-scale V(SRP-SRN)=40mV.
  R=25mOhm -> full-scale charge current = 40mV/25mOhm = 1.6A (BQ24650 regulates
  charge current down to the 1.5A target). At 1.5A: P = I^2*R = 2.25*0.025 =
  0.056W, well under the 2W rating. If exactly 1.5A full-scale wanted, use 27mOhm
  (40mV/27mOhm = 1.48A); 25mOhm is a stocked E24-friendly value and preferred.
