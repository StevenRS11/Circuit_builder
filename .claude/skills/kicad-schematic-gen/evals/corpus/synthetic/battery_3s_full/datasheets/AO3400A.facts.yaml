notes: >
  Primary N-FET for this board. Covers BQ24650 synchronous-buck high-side and
  low-side switches (15V in, ~12.2V/1.5A charge) cleanly. Also usable as the
  LM5050-1 VBUS-branch ideal-diode FET, BUT at 3A continuous: P = I^2*Rds =
  9*0.036 = ~0.32W in SOT-23 (theta_ja ~250 C/W) -> ~80 C rise, runs hot.
  Acceptable for intermittent USB charging; if VBUS-FET continuous dissipation
  matters, upsize that one position to CSD18540Q5B (SON 5x6, 2.2mOhm). Same
  KiCad symbol family; both carded here.
