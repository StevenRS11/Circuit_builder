mpn: "LTC4357CMS8#TRPBF"
manufacturer: Analog Devices (Linear Technology)
description: "Positive high-voltage ideal-diode controller, 9V-80V, drives external N-channel MOSFET to replace a Schottky in diode-OR / high-current diode apps"
role: >
  Power-path ORing MUX controller (R2 enabler, Path B), CANDIDATE. Functionally like
  LM5050-1 (single N-FET ideal diode, needs TWO for a 2-input VBUS||VBAT OR), but pricier,
  thinner stock, and a 9V floor that is acceptable but tighter for the 9-12.6V battery rail.

