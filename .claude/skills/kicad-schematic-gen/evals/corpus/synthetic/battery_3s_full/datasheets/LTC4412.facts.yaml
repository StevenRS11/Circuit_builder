# Fact card — intrinsic part facts only (no per-design connectivity)
mpn: "LTC4412ES6#TRPBF"
manufacturer: Analog Devices (Linear Technology)
description: "Low-loss PowerPath controller, ThinSOT-23-6, drives external P-channel MOSFET as a near-ideal diode (~20mV drop), automatic switchover, 11uA Iq"
role: >
  Power-path ORing MUX controller (R2 enabler, Path B), CANDIDATE / runner-up. Drives a
  P-FET ideal diode; intended for primary(adapter)+battery auto-switchover. STAT pin can
  gate an auxiliary P-FET to give explicit priority. P-FET-native and design-friendly, but
  pricier than LM5050-1 and lower voltage headroom.

