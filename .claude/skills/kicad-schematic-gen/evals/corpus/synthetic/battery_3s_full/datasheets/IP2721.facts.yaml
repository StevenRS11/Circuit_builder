  - { number: "10", name: "NC",    type: "no_connect",    page: 3 }
  - { number: "11", name: "SEL",   type: "input",         page: 4 }   # voltage-select: HIGH=20V, FLOAT=15V, GND=5V
  - { number: "12", name: "CC2",   type: "bidirectional", page: 4 }   # Type-C CC2
