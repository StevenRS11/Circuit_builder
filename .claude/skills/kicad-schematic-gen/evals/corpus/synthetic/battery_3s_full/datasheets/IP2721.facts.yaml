pinout_verified: false
# 15V selection: SEL pin LEFT FLOATING -> requests 15V max. (SEL=VSELH/high -> 20V;
#   SEL=GND -> 5V only). Coarse 3-state select; only 5/15/20V available.
#   CAUTION: 15V relies on a FLOATING pin, which is noise-susceptible; many designs
#   prefer a defined level. No fine voltage table.
# VBUS gate: YES. VBUSG (pin 1) is an integrated gate driver for an EXTERNAL power
#   NMOS load switch: turns the NMOS ON only after CC negotiation completes, OFF on
#   disconnect. This provides a controlled VBUS output-enable and soft-start, directly
#   supporting R7 (the external NMOS also serves as the path-control/blocking FET).
#   NMOS Vds rating >=30V recommended.
